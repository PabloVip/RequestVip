name: Daily Database Backup

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Create backup
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump \
            -h aws-0-eu-west-1.pooler.supabase.com \
            -U postgres.zdzgsvlwvxldotifaqff \
            -d postgres \
            -p 6543 \
            --no-password \
            --format=custom \
            -f backup_$(date +%Y%m%d_%H%M%S).dump

      - name: Upload to backup repo
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          REPO: ${{ secrets.BACKUP_REPO }}
        run: |
          git config --global user.email "backup@tunevip.app"
          git config --global user.name "TuneVIP Backup"
          git clone https://x-access-token:${TOKEN}@github.com/${REPO}.git backup-repo
          mv *.dump backup-repo/
          cd backup-repo
          ls -t *.dump 2>/dev/null | tail -n +31 | xargs -r rm
          git add .
          git commit -m "Backup $(date +%Y-%m-%d)"
          git push
